     arriving here from a person's page is a step further in, not a different site: paper by

     The page is left-to-right and the Arabic is marked RTL block by block. Setting the whole

<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{NAME_LAT}} — Wasl</title>
<meta name="color-scheme" content="light dark">
<style>
:root{ {{PALETTE}}
  --paper:#F6F0E4; --paper-2:#EDE4D1; --card:#FBF7EE;
  --ink:#1A2620; --ink-2:#4F5E56; --ink-3:#83908A;
  --act:#0F5A3C;
  --rule:rgba(26,38,32,.13); --rule-2:rgba(169,139,66,.55); --hi:rgba(169,139,66,.15);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"Amiri","Scheherazade New","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#08301F; --paper-2:#0C4A31; --card:#0A3A27;
    --ink:#F2EADB; --ink-2:#B9C9BC; --ink-3:#7E968A; --act:#C9A55F;
    --rule:rgba(201,165,95,.2); --rule-2:rgba(201,165,95,.5); --hi:rgba(169,139,66,.2)}
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--serif);
  -webkit-font-smoothing:antialiased}
a{color:var(--act)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lbl{font:600 11px/1 var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3)}
.wrap{max-width:820px;margin:0 auto;padding:0 22px}

/* ---------- masthead: the way back is the first thing, and it names where it goes -------- */
header{border-bottom:1px solid var(--rule);background:var(--paper-2);padding:12px 0 26px}
.back{display:inline-flex;align-items:center;gap:7px;font:14px var(--sans);text-decoration:none;
  min-height:44px}
.back:hover{text-decoration:underline}
h1{margin:10px 0 0;font-weight:400;line-height:1.2}
h1 .ar{display:block;font-family:var(--arabic);font-size:clamp(38px,7vw,58px);color:var(--ink);
  direction:rtl;text-align:left;unicode-bidi:isolate;line-height:1.3}
h1 .lat{display:block;font:600 clamp(20px,2.4vw,27px)/1.25 var(--serif);margin-top:2px}
h1 .lat s{text-decoration:none;color:var(--ink-3);font-weight:400}

main{max-width:820px;margin:0 auto;padding:0 22px 70px}

/* ---------- the brief: heading, then the prose, then what it rests on ---------- */
#sum{margin:26px 0 0;padding:22px 24px;border:1px solid var(--rule-2);border-radius:12px;
  background:var(--card)}
#sum h2{margin:0 0 12px;font:600 22px/1.2 var(--serif)}
.prose{font-size:17.5px;line-height:1.7}
.sl{display:inline}
.sl .t{font-style:normal}
.sl.ed{color:var(--ink-2);font-style:italic}
/* the page mark is a superscript; ::after grows it to a 24px pointer target without
   growing the glyph, which would break the line */
.sp{font:11px var(--sans);vertical-align:super;color:var(--gold);text-decoration:none;
  margin:0 2px 0 3px;border-bottom:1px dotted var(--gold);position:relative}
.sp::after{content:"";position:absolute;top:-7px;bottom:-9px;left:-6px;right:-6px}
.sl q{display:none}
#anch{margin-top:14px;border:1px solid var(--rule-2);background:transparent;color:var(--act);
  border-radius:999px;padding:8px 15px;font:13.5px var(--sans);cursor:pointer;min-height:36px}
#anch:hover,#anch.on{background:var(--hi)}
/* with the anchors shown each sentence becomes its own block, sitting above the Arabic it
   rests on - the claim and its evidence on adjacent lines */
#sum.anchors .sl{display:block;margin-bottom:10px}
#sum.anchors .sl q{display:block;quotes:none;direction:rtl;text-align:right;
  font-family:var(--arabic);font-size:17px;line-height:1.95;color:var(--ink-2);
  margin:4px 0 0;padding-right:12px;border-right:2px solid var(--rule-2)}
.sumnote{margin:14px 0 0;font:12.5px/1.55 var(--sans);color:var(--ink-3)}
.note{margin:0 0 16px;font:12.5px/1.55 var(--sans);color:var(--ink-3);max-width:70ch}

/* ---------- the entry itself ---------- */
section{margin-top:38px;border-top:1px solid var(--rule);padding-top:20px}
.src{font:12px/1.5 var(--sans);color:var(--ink-3);margin-bottom:16px}
.src b{color:var(--ink-2);font-weight:600}
.src i{display:block;font-style:normal;opacity:.75}
.ar-head{font-family:var(--arabic);font-size:24px;color:var(--gold);margin:0 0 14px;font-weight:600}
h3{font-family:var(--arabic);font-size:19px;color:var(--gold);margin:26px 0 10px;font-weight:600}
p{margin:0 0 15px;font-family:var(--arabic);font-size:20px;line-height:2.1}
.isnad{color:var(--ink-3);font-size:.88em}
/* the page number sits in the margin of the page it opens, so a reader can find the place
   in the printed book without breaking the column */
.pg{float:left;margin:7px 14px 4px 0;font:11px var(--sans);color:var(--gold);text-decoration:none;
  border:1px solid var(--rule-2);border-radius:5px;padding:2px 7px;direction:ltr}
.pg:target{background:var(--hi);color:var(--ink)}

footer{border-top:1px solid var(--rule);padding:22px 0 calc(26px + env(safe-area-inset-bottom));
  font:13px/1.7 var(--sans);color:var(--ink-3)}

@media (max-width:640px){
  .wrap,main{padding-left:14px;padding-right:14px}
  #sum{padding:16px 16px 18px;border-radius:10px}
  .prose{font-size:16.5px}
  p{font-size:19px;line-height:2}
  .ar-head{font-size:21px}
}
</style></head><body>
<header><div class="wrap">
  <a class="back" href="/#{{PID}}">&#8592; <span data-k="back"></span> {{NAME_LAT}}</a>
  <h1><span class="ar" dir="rtl" lang="ar">{{NAME_AR}}</span><span class="lat">{{NAME_LAT}}{{WHO}}</span></h1>
</div></header>
{{NOTE}}
<main>{{SUMMARY}}{{BODY}}</main>
<footer><div class="wrap"><a href="/#{{PID}}"><span data-k="back"></span> {{NAME_LAT}}</a></div></footer>
<script>
const UI = {{UI}};
let lang = localStorage.getItem('wasl-lang') || 'en';
if (!['en','id','ms'].includes(lang)) lang = 'en';
document.documentElement.lang = lang;
document.querySelectorAll('[data-k]').forEach(e => { e.textContent = UI[e.dataset.k][lang]; });
document.querySelectorAll('[data-k-t]').forEach(e => { e.title = UI[e.dataset.kT][lang]; });
if (lang !== 'en')
  document.querySelectorAll('.sl .t').forEach(e => {
    if (e.dataset[lang]) e.textContent = e.dataset[lang];
  });
const anch = document.getElementById('anch');
if (anch) anch.addEventListener('click', () => {
  const on = document.getElementById('sum').classList.toggle('anchors');
  anch.classList.toggle('on', on);
});
</script>
<script src="../tools/check_responsive.js"></script>
</body></html>
