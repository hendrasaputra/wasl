<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wasl — the lineage of the Prophet Muḥammad, traced to its sources</title>
<meta name="color-scheme" content="light dark">
<style>
/* ---------- tokens: a manuscript page by day, the old green by night ---------- */
:root{{{CSSVARS}}
  --paper:#F6F0E4; --paper-2:#EDE4D1; --card:#FBF7EE;
  --ink:#1A2620; --ink-2:#4F5E56; --ink-3:#83908A;
  --act:#0F5A3C; --act-2:#0B4630;
  --rule:rgba(26,38,32,.13); --rule-2:rgba(169,139,66,.55); --hi:rgba(169,139,66,.15);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"Amiri","Scheherazade New","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#08301F; --paper-2:#0C4A31; --card:#0A3A27;
    --ink:#F2EADB; --ink-2:#B9C9BC; --ink-3:#7E968A;
    --act:#C9A55F; --act-2:#E0C07A;
    --rule:rgba(201,165,95,.2); --rule-2:rgba(201,165,95,.5); --hi:rgba(169,139,66,.2)}
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--serif);
  -webkit-font-smoothing:antialiased}
a{color:var(--act)}
button{font:inherit;color:inherit}
.ar{font-family:var(--arabic)}
/* labels are the only sans on the page, so a small capital line always means "heading" */
.lbl{font:600 11px/1 var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;left:-9999px}

/* ---------- masthead: the name, the one search, the language ---------- */
.mast{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;
  padding:10px 24px;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:9px;text-decoration:none;color:var(--ink);flex:0 0 auto}
.brand b{font:600 22px/1 var(--serif);letter-spacing:.2px}
.brand .ar{font-size:26px;color:var(--gold);line-height:1}
.search{position:relative;flex:1;min-width:0;max-width:640px;margin:0 auto}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  color:var(--ink-3);pointer-events:none}
#q{width:100%;border:1px solid var(--rule-2);border-radius:10px;background:var(--card);
  color:var(--ink);font:16px var(--sans);padding:10px 40px 10px 38px;min-height:44px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
#q::placeholder{color:var(--ink-3);opacity:1}
#q:focus{outline:2px solid var(--gold);outline-offset:1px}
#qclear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:30px;height:30px;
  border:0;border-radius:50%;background:var(--paper-2);color:var(--ink-2);cursor:pointer;display:none;
  align-items:center;justify-content:center;font:700 14px/1 var(--sans);padding:0}
#qclear.on{display:flex}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;max-height:64vh;overflow-y:auto;
  background:var(--card);border:1px solid var(--rule-2);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.22)}
.rr{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;padding:9px 14px;
  cursor:pointer;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.rr:last-child{border-bottom:0}
.rr:hover,.rr.on{background:var(--hi)}
.rr .ar{font-size:20px;grid-row:span 2;align-self:center}
.rr .lat{font-size:15px}
.rr .path{font:12px var(--sans);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .path b{color:var(--gold);font-weight:600}
#results .none,#results .more{padding:12px 14px;font:13px var(--sans);color:var(--ink-3)}
.langs{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;flex:0 0 auto}
.langs button{border:0;background:transparent;color:var(--ink-2);font:12px var(--sans);padding:6px 10px;cursor:pointer;min-height:32px}
.langs button.on{background:var(--hi);color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- home: say what it is, then hand over the people ---------- */
.hero{position:relative;overflow:hidden;padding:64px 0 34px;text-align:center}
.hero .rose{position:absolute;width:520px;top:-250px;left:50%;transform:translateX(-50%);color:var(--gold);
  opacity:.14;pointer-events:none}
.hero h1{position:relative;margin:0;font:600 clamp(34px,5.4vw,58px)/1.08 var(--serif);letter-spacing:-.01em}
.hero h1 .ar{display:block;font-size:.95em;color:var(--gold);font-weight:400;margin-top:4px}
.hero p{position:relative;margin:18px auto 0;max-width:52ch;font-size:clamp(16px,1.6vw,19px);color:var(--ink-2);line-height:1.5}
.try{position:relative;margin:22px auto 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.try .lbl{margin-right:4px}
.chip{border:1px solid var(--rule-2);background:transparent;border-radius:999px;padding:7px 14px;
  font:14px var(--sans);cursor:pointer;color:var(--act);min-height:36px}
.chip:hover{background:var(--hi)}
.sec{margin-top:40px}
.sec>h2{margin:0 0 14px;font:600 22px/1.2 var(--serif)}
.sec>h2 small{display:block;margin-top:5px;font:14px var(--sans);color:var(--ink-3)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:26px 32px}
.group h3{margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{display:flex;flex-direction:column;gap:2px;padding:11px 12px;border:1px solid var(--rule);
  border-radius:10px;background:var(--card);text-decoration:none;color:var(--ink);min-height:74px}
.card:hover{border-color:var(--gold);background:var(--hi)}
.card .ar{font-size:23px;line-height:1.25;color:var(--ink)}
.card .lat{font-size:13.5px;color:var(--ink-2)}
.card .dot{font:10.5px var(--sans);color:var(--gold);margin-top:auto;padding-top:4px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 28px;margin-top:14px}
.how div{padding-left:14px;border-left:2px solid var(--rule-2);font-size:15px;color:var(--ink-2);line-height:1.55}
.how div b{display:block;font:600 26px/1 var(--serif);color:var(--gold);margin-bottom:8px}
.counts{margin-top:22px;font:13px var(--sans);color:var(--ink-3)}

/* ---------- person: the crown, then the thread beside the life ---------- */
.crown{padding:34px 0 20px;border-bottom:1px solid var(--rule)}
.crown .lbl{display:flex;flex-wrap:wrap;gap:6px 14px}
.crown .lbl em{font-style:normal;color:var(--gold)}
.crown .name{margin:10px 0 0;font-weight:400;line-height:1.2}
.crown .name .ar{display:block;font-size:clamp(42px,6vw,64px);color:var(--ink);line-height:1.25;direction:rtl;text-align:left;unicode-bidi:isolate}
.crown .name .lat{display:block;font:600 clamp(22px,2.6vw,30px)/1.2 var(--serif);margin-top:4px}
.crown .who{margin:10px 0 0;font-size:15px;color:var(--ink-2)}
.crown .who span+span::before{content:"·";margin:0 8px;color:var(--ink-3)}
.crown .note{margin:12px 0 0;max-width:70ch;font-size:15px;color:var(--ink-2);padding-left:12px;border-left:2px solid var(--rule-2)}
.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:44px;align-items:start;padding:26px 0 60px}
@media (max-width:900px){.grid{grid-template-columns:1fr;gap:30px}}

/* the thread: one line, beads for people, and on every link the books that attest it */
.thread h2{margin:0 0 4px}
.thread .sub{font:12.5px var(--sans);color:var(--ink-3);margin:0 0 14px}
.thread ol{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.thread ol::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;border-left:2px solid var(--rule-2)}
.thread li{position:relative;padding:5px 0 5px 8px}
.thread li::before{content:"";position:absolute;left:-19px;top:14px;width:10px;height:10px;border-radius:50%;
  background:var(--paper);border:2px solid var(--gold)}
.node{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:inherit;min-height:32px;
  padding:2px 6px;margin-left:-6px;border-radius:7px}
.node:hover{background:var(--hi)}
.node .lat{font-size:15.5px;color:var(--act)}
.node .ar{font-size:19px;color:var(--ink-2);margin-left:auto}
.node .gen{font:11px var(--sans);color:var(--ink-3);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.thread li.me{margin:6px 0}
.thread li.me::before{width:16px;height:16px;left:-22px;top:12px;background:var(--gold);border-color:var(--gold)}
.thread li.me .node{background:var(--card);border:1px solid var(--rule-2);padding:8px 10px}
.thread li.me .node .lat{font:600 19px/1.2 var(--serif);color:var(--ink)}
.thread li.me .node .ar{font-size:24px;color:var(--ink)}
.thread li.fold::before{display:none}
.thread li.fold{padding:2px 0 2px 8px}
.thread li.fold button,.thread .unfoldbk{border:1px dotted var(--rule-2);background:transparent;color:var(--ink-2);
  border-radius:7px;padding:5px 10px;font:12.5px var(--sans);cursor:pointer;min-height:32px}
.thread li.fold button:hover,.thread .unfoldbk:hover{background:var(--hi)}
.edge{display:inline-flex;align-items:center;gap:5px;margin:0 0 3px 6px;border:0;background:transparent;
  color:var(--ink-3);font:11.5px var(--sans);cursor:pointer;padding:3px 6px;border-radius:6px;min-height:24px}
.edge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.8}
.edge:hover,.edge.on{color:var(--ink);background:var(--hi)}
.edgeq{margin:4px 0 8px;padding:0 0 0 6px;border-left:2px solid var(--rule)}
.thread .side{margin:2px 0 4px 6px;font:13px var(--sans);color:var(--ink-3)}
.thread .side a{color:var(--act);text-decoration:none}
.thread .side a:hover{text-decoration:underline}
.kids{margin:8px 0 0 8px;padding-left:18px;border-left:2px dotted var(--rule-2)}
.kids .lbl{margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:baseline;gap:8px;padding:6px 11px;border:1px solid var(--rule);border-radius:8px;
  background:var(--card);text-decoration:none;color:var(--ink);font-size:14px;min-height:36px}
.pill:hover{border-color:var(--gold);background:var(--hi)}
.pill .ar{font-size:16px;color:var(--ink-2)}
.pill s{text-decoration:none;color:var(--ink-3);font-size:12px}
.pill.more{cursor:pointer;color:var(--ink-3);font:13px var(--sans);border-style:dashed}
.treelink{display:inline-block;margin-top:16px;font:13px var(--sans);color:var(--ink-3)}
.treelink a{color:var(--act)}

/* the life: brief, family, then the books */
.life h2{margin:0 0 10px;font:600 22px/1.2 var(--serif)}
.brief{padding:20px 22px;border:1px solid var(--rule-2);border-radius:12px;background:var(--card)}
.brief p{margin:0;font-size:17px;line-height:1.65}
.brief .ed{color:var(--ink-2);font-style:italic}
.brief .basis{margin-top:12px;font:12.5px var(--sans);color:var(--ink-3);line-height:1.5}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:11px 16px;border-radius:9px;
  background:var(--gold);color:#17251E;text-decoration:none;font:600 14.5px var(--sans);min-height:44px}
.cta:hover{background:var(--gold-lt)}
.cta i{font-style:normal;font-weight:400;opacity:.8}
.fam{margin-top:30px}
.fam .row{margin-bottom:14px}
.fam .row .lbl{margin-bottom:7px}
.books{margin-top:34px}
.books>h2 small{font:13px var(--sans);color:var(--ink-3);margin-left:8px}
.books details{border-top:1px solid var(--rule)}
.books summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 0;
  font:600 14px var(--sans);color:var(--ink)}
.books summary::-webkit-details-marker{display:none}
.books summary::before{content:"+";width:18px;height:18px;border:1px solid var(--rule-2);border-radius:4px;
  font:600 13px/16px var(--sans);text-align:center;color:var(--gold)}
.books details[open]>summary::before{content:"\2212"}
.books summary small{font-weight:400;color:var(--ink-3)}
.cl{margin:0 0 12px 28px;padding:14px 16px;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
.cl .q{font-family:var(--arabic);font-size:21px;line-height:1.9;direction:rtl;text-align:right;margin:0 0 8px}
.cl .en{font-size:14.5px;color:var(--ink-2);margin:0 0 8px}
.cl .isnad{font:12.5px var(--sans);color:var(--ink-3);margin-bottom:8px}
.cl .isnad .ara{font-family:var(--arabic);font-size:16px;direction:rtl;display:block;color:var(--ink-2)}
.cl .src{font:12px/1.5 var(--sans);color:var(--ink-3);border-top:1px solid var(--rule);padding-top:8px}
.cl .src b{color:var(--ink-2);font-weight:600}
.cl .src i{display:block;font-style:normal}
.cl .flag{display:inline-block;font:600 10.5px/1.7 var(--sans);letter-spacing:.4px;padding:0 8px;border-radius:999px;
  background:var(--hi);color:var(--ink-2);margin:0 4px 8px 0}
.cl.dissent{border-style:dashed;border-color:var(--rule-2)}
.cl .tn{font:12px var(--sans);color:var(--gold);margin-top:7px;font-style:italic}
.edgeq .cl{margin-left:0}

footer{border-top:1px solid var(--rule);margin-top:20px;padding:26px 0 calc(30px + env(safe-area-inset-bottom));
  font:13px/1.8 var(--sans);color:var(--ink-3)}
footer b{color:var(--ink-2);font-weight:600}
footer .inner{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- phones: one column, every target 44px, nothing modal ---------- */
@media (max-width:640px){
  .mast{flex-wrap:wrap;gap:10px;padding:8px 14px}
  .brand{order:0}.langs{order:1;margin-left:auto}
  .search{order:2;flex:1 1 100%;max-width:none}
  body.home .search{display:none}      /* the hero carries the search on the front page */
  .hero{padding:26px 0 20px}
  .hero .rose{width:340px;top:-170px}
  .hero .hs{margin-top:20px}
  main{padding:0 14px}
  .groups{grid-template-columns:1fr;gap:20px}
  .cards{grid-template-columns:1fr 1fr}
  .card{min-height:64px;padding:10px}
  .card .ar{font-size:21px}
  .crown{padding:22px 0 16px}
  .node{min-height:44px;padding:6px}
  .pill{min-height:44px;padding:9px 12px}
  .chip{min-height:44px;padding:10px 16px}
  .langs button{min-height:36px;padding:8px 11px}
  .edge{min-height:28px}
  .cl{margin-left:0}
  .brief{padding:16px}
  .brief p{font-size:16px}
  footer .inner{padding:0 14px}
}
/* the hero search is the mast search moved into the hero, so the page has one search */
.hs{position:relative;margin:26px auto 0;max-width:620px}
.hs .search{max-width:none}
.hs #q{font-size:17px;min-height:52px;padding:14px 44px 14px 42px;border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.08),inset 0 1px 2px rgba(0,0,0,.06)}
.hs .search svg{left:16px}
body.home .mast .search{display:none}
</style>
</head>
<body>
<header class="mast">
  <a class="brand" href="#" id="brand"><b>Wasl</b><span class="ar" dir="rtl" lang="ar">وصل</span></a>
  <div class="search" id="searchwrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search names"
      placeholder="Search names — Arabic or transliteration">
    <button id="qclear" type="button" aria-label="Clear search">×</button>
    <div id="results" hidden></div>
  </div>
  <span class="langs" id="langs"></span>
</header>

<main>
<section id="home">
  <div class="hero">
    <div class="rose" aria-hidden="true">{{ROSETTE}}</div>
    <h1>Wasl<span class="ar" dir="rtl" lang="ar">وصل</span></h1>
    <p id="hero"></p>
    <div class="hs" id="hs"></div>
    <div class="try" id="try"></div>
  </div>
  <div class="sec">
    <h2 id="startH"></h2>
    <div class="groups" id="groups"></div>
  </div>
  <div class="sec">
    <h2 id="howH"></h2>
    <div class="how" id="how"></div>
    <div class="counts" id="counts"></div>
  </div>
</section>

<section id="person" hidden>
  <div class="crown" id="crown"></div>
  <div class="grid">
    <aside class="thread" id="thread" aria-label="Line of descent"></aside>
    <article class="life" id="life"></article>
  </div>
</section>
</main>

<footer><div class="inner" id="foot"></div></footer>

<script id="data" type="application/json">{{DATA}}</script>
<script id="stats-data" type="application/json">{{STATS}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const S = JSON.parse(document.getElementById('stats-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- language: the Arabic never moves; only the reading aids do ---------- */
let LANG = localStorage.getItem('wasl-lang') || (navigator.language || '').slice(0,2).replace('in','id');
if (!['en','id','ms'].includes(LANG)) LANG = 'en';
let T = D.ui[LANG];
const tr = (k, n) => (T[k] || D.ui.en[k] || k).replace('{n}', n);
const glossOf = c => c[LANG] || c.en;
const dtr = s => (s && D.dtr[LANG] && D.dtr[LANG][s]) || s;
const lat = id => D.people[id].name_lat, ara = id => D.people[id].name_ar;

/* ---------- indexes over the data, built once ---------- */
// marriage is a graph edge, never a tree edge: its own two-way index
const SPOUSE = new Map();
D.claims.forEach(c => { if (c.type === 'married_to' && c.object)
  for (const [a, b] of [[c.subject, c.object], [c.object, c.subject]])
    { if (!SPOUSE.has(a)) SPOUSE.set(a, []); if (!SPOUSE.get(a).includes(b)) SPOUSE.get(a).push(b); } });
// the people the directory names, and the group it names them under
const NOTABLE = new Map();
D.directory.forEach(([g, rows]) => rows.forEach(([label, id]) => { if (!NOTABLE.has(id)) NOTABLE.set(id, [label, g]); }));
// claims per person and per parent edge, so a panel never scans 4,000 rows
const BY = {}, EDGE = {};
D.claims.forEach(c => {
  (BY[c.subject] = BY[c.subject] || []).push(c);
  if (c.object && c.object !== c.subject) (BY[c.object] = BY[c.object] || []).push(c);
  if (c.type === 'father_of' || c.type === 'mother_of') (EDGE[c.subject + '|' + c.object] = EDGE[c.subject + '|' + c.object] || []).push(c);
});
/* Every id from the root down to pid, root first. Falls back to the mother where these books
   never name the father. */
const pathTo = pid => { const out = []; let c = pid; while (c) { out.unshift(c); c = D.father[c] || D.mother[c]; } return out; };

/* ---------- a claim as evidence: the Arabic, the gloss, the page ---------- */
const TYPEKEY = {father_of:'g_father_of', mother_of:'g_mother_of', married_to:'g_married', chain:'g_chain',
  kunya:'g_kunya', alias:'g_alias', dissent:'g_dissent', variant_chain:'g_variant',
  isnad:'g_isnad', birth:'g_birth', age_at_death:'g_age'};
const ORDER = ['father_of','mother_of','married_to','kunya','alias','birth','age_at_death','chain','variant_chain','dissent','isnad'];
function claimHTML(c){
  const w = D.works[c.work] || {};
  const pg = c.page_end && c.page_end !== c.page ? `${c.page}–${c.page_end}` : c.page;
  const flags = [];
  if (c.grade === 'dissent') flags.push('variant reading');
  if (c.author_verdict) flags.push(esc(dtr(c.author_verdict)));
  if (c.chain_label) flags.push(esc(dtr(c.chain_label)));
  if (c.date_basis) flags.push('date basis: ' + esc(c.date_basis).replace(/_/g,' '));
  return `<div class="cl${c.type==='dissent'||c.grade==='dissent'?' dissent':''}">
    ${flags.map(f=>`<span class="flag">${f}</span>`).join('')}
    <div class="q" dir="rtl" lang="ar">${esc(c.ar)}</div>
    <div class="en">${esc(glossOf(c))}</div>
    ${c.isnad_ar?`<div class="isnad">${esc(tr('isnad_label'))} · ${esc(dtr(c.isnad_lat||''))}<span class="ara" dir="rtl" lang="ar">${esc(c.isnad_ar)}</span></div>`:''}
    ${c.note?`<div class="en">${esc(dtr(c.note))}</div>`:''}
    ${c.text_note?`<div class="tn">${esc(tr('ednote'))}: ${esc(dtr(c.text_note))}</div>`:''}
    <div class="src"><b>${esc(w.title_lat||c.work)}</b> — ${esc(w.author_lat||'')}, ${esc(tr('vol'))} ${c.vol}, ${esc(tr('p'))} ${pg}
      <i>${esc(w.edition||'')}</i><i>${esc(w.version_uri||'')} · ${esc(tr('claim'))} ${c.cid}</i></div>
  </div>`;
}

/* ---------- pieces ---------- */
const pill = (id, disamb) => `<a class="pill" href="#${id}">${esc(lat(id))}${disamb?` <s>b. ${esc(disamb)}</s>`:''}<span class="ar" dir="rtl" lang="ar">${esc(ara(id))}</span></a>`;
/* A row of people as pills. When a name repeats inside one row - two Zaynabs among the wives -
   the father is named alongside, and only then. Rows past `cap` fold behind a count. */
function pillRow(label, ids, cap = 14){
  if (!ids.length) return '';
  const seen = {}; ids.forEach(i => seen[lat(i)] = (seen[lat(i)]||0) + 1);
  const one = i => pill(i, seen[lat(i)] > 1 && D.father[i] ? lat(D.father[i]) : null);
  const rest = ids.length > cap ? `<button class="pill more" type="button" data-more="1">${esc(tr('more', ids.length - cap))}</button><span hidden>${ids.slice(cap).map(one).join('')}</span>` : '';
  return `<div class="row"><div class="lbl">${label} · ${ids.length}</div><div class="pills">${ids.slice(0, cap).map(one).join('')}${rest}</div></div>`;
}

/* The thread. Root at the top, the person as the large bead, their children hanging beneath.
   Between every two beads sits the count of sources that attest that one link; pressing it
   opens those quotations right there on the line. The long middle folds by default. */
let unfolded = false;
function threadHTML(pid){
  const line = pathTo(pid), anc = line.slice(0, -1);
  const KEEP = 5;
  const edgeBtn = (f, c) => { const n = (EDGE[f + '|' + c] || []).length;
    return n ? `<button class="edge" type="button" data-edge="${f}|${c}" title="${esc(tr('edge_src', n))}">${n} ${esc(tr('b_src'))}</button>` : ''; };
  const node = (id, gen, me) => `<li class="${me?'me':''}" data-id="${id}">
      ${gen > 1 ? edgeBtn(line[gen-2], id) : ''}
      <a class="node" href="#${id}"><span class="gen">${gen}</span><span class="lat">${esc(lat(id))}</span><span class="ar" dir="rtl" lang="ar">${esc(ara(id))}</span></a></li>`;
  let items;
  if (!unfolded && anc.length > KEEP + 3)
    items = [node(anc[0], 1, false),
             `<li class="fold"><button type="button" data-unfold="1">${esc(tr('fold_n', anc.length - 1 - KEEP))}</button></li>`,
             ...anc.slice(-KEEP).map((id, i) => node(id, anc.length - KEEP + i + 1, false))];
  else items = anc.map((id, i) => node(id, i + 1, false));
  const m = D.mother[pid], f = D.father[pid];
  const side = m ? `<div class="side">${esc(tr('m_mother'))} · <a href="#${m}">${esc(lat(m))}</a></div>`
             : (!f && line.length === 1 ? `<div class="side">${esc(tr('no_father'))}</div>` : '');
  const kids = D.kids[pid] || [];
  return `<h2 class="lbl">${esc(tr('thread'))}</h2>
    <p class="sub">${esc(tr('m_gen', line.length))}${D.below[pid] ? ' · ' + esc(tr('m_desc', D.below[pid])) : ''}</p>
    <ol>${items.join('')}${node(pid, line.length, true)}</ol>${side}
    ${kids.length ? `<div class="kids">${pillRow(esc(tr('g_children')), kids, 12)}</div>` : ''}
    ${unfolded && anc.length > KEEP + 3 ? `<button class="unfoldbk" type="button" data-fold="1">${esc(tr('fold_back'))}</button>` : ''}
    <div class="treelink"><a href="tree.html#${pid}">${esc(tr('open_tree'))} →</a></div>`;
}

function crownHTML(pid){
  const p = D.people[pid], cs = BY[pid] || [];
  const nb = NOTABLE.get(pid);
  const eyebrow = [p.sahabi ? `<em>${esc(tr('b_sahabi'))}</em>` : null,
    nb ? esc(dtr(nb[1])) : (D.band_key[D.band[pid]] ? esc(tr(D.band_key[D.band[pid]])) : null)];
  const seen = new Set(); const eye = eyebrow.filter(Boolean).filter(x => { const k = x.replace(/<[^>]*>/g,'').toLowerCase(); return seen.has(k) ? false : (seen.add(k), true); });
  const kunyas = [...new Set([p.kunya_lat, ...cs.filter(c => c.type==='kunya' && c.subject===pid).map(c => c.value_lat)].filter(Boolean))].slice(0, 3);
  const who = [];
  kunyas.forEach(k => who.push(`${esc(tr('m_kunya'))} ${esc(k)}`));
  if (p.laqab_lat) who.push(`${esc(tr('m_laqab'))} ${esc(p.laqab_lat)}`);
  if (p.tribe) who.push(esc(dtr(p.tribe)));
  const birth = cs.find(c => c.type === 'birth');
  who.push(birth ? `${esc(tr('m_born'))} ${esc(dtr(birth.event_lat) || '—')}` : esc(tr('m_noyear')));
  return `<div class="lbl">${eye.map(x => `<span>${x}</span>`).join('')}</div>
    <h1 class="name"><span class="ar" dir="rtl" lang="ar">${esc(p.name_ar)}</span><span class="lat">${esc(p.name_lat)}</span></h1>
    <p class="who">${who.map(x => `<span>${x}</span>`).join('')}</p>
    ${p.note ? `<p class="note">${esc(dtr(p.note))}</p>` : ''}`;
}

function lifeHTML(pid){
  const p = D.people[pid], cs = BY[pid] || [];
  const sm = D.summaries[pid], bio = D.bios && D.bios[pid];
  const w = sm && D.works[sm.work];
  const brief = sm ? `<section class="brief"><h2>${esc(tr('brief'))}</h2>
      <p>${sm.lines.map(l => `<span class="${l.basis==='editorial'?'ed':''}">${esc(l[LANG] || l.en)}</span>`).join(' ')}</p>
      <div class="basis">${esc(tr('brief_note').replace('{w}', w ? w.title_lat : sm.work))}</div>
      ${bio ? `<a class="cta" href="bio/${encodeURIComponent(pid)}.html">${esc(tr('bio_read'))} → <i>${esc(tr('bio_from', bio.length))}</i></a>` : ''}
    </section>`
    : (bio ? `<a class="cta" href="bio/${encodeURIComponent(pid)}.html">${esc(tr('bio_read'))} → <i>${esc(tr('bio_from', bio.length))}</i></a>` : '');
  const sibs = (D.father[pid] ? (D.kids[D.father[pid]] || []) : []).filter(x => x !== pid);
  const fam = pillRow(esc(tr(p.sex === 'F' ? 'g_husband' : 'g_spouses')), SPOUSE.get(pid) || [])
            + pillRow(esc(tr('g_siblings')), sibs);
  const groups = ORDER.filter(t => cs.some(c => c.type === t)).map((t, i) => {
    const own = cs.filter(c => c.type === t);
    return `<details${i === 0 ? ' open' : ''}><summary>${esc(tr(TYPEKEY[t] || t))} <small>· ${own.length}</small></summary>${own.map(claimHTML).join('')}</details>`;
  }).join('');
  return `${brief}
    ${fam ? `<section class="fam"><h2>${esc(tr('family'))}</h2>${fam}</section>` : ''}
    <section class="books"><h2>${esc(tr('books_say'))}<small>${cs.length} ${esc(tr('claim'))}s</small></h2>${groups}</section>`;
}

/* ---------- home ---------- */
function homeHTML(){
  $('#hero').textContent = tr('hero');
  $('#startH').innerHTML = `${esc(tr('start'))}<small>${esc(tr('whoswho'))} · ${NOTABLE.size}</small>`;
  $('#howH').textContent = tr('how');
  $('#try').innerHTML = `<span class="lbl">${esc(tr('try'))}</span>` + ['ʿĀʾisha', 'al-Ḥusayn', 'Khazraj', 'قصي']
    .map(x => `<button class="chip" type="button" data-try="${esc(x)}">${esc(x)}</button>`).join('');
  $('#groups').innerHTML = D.directory.map(([g, rows]) => `<div class="group"><h3 class="lbl">${esc(dtr(g))}</h3><div class="cards">`
    + rows.map(([label, id]) => `<a class="card" href="#${id}"><span class="ar" dir="rtl" lang="ar">${esc(ara(id))}</span><span class="lat">${esc(label)}</span>${(D.bios&&D.bios[id])?`<span class="dot">◆ ${esc(tr('bio_read'))}</span>`:''}</a>`).join('')
    + '</div></div>').join('');
  $('#how').innerHTML = [1,2,3].map(i => `<div><b>${i}</b>${esc(tr('how_' + i))}</div>`).join('');
  $('#counts').textContent = [tr('s_names', S.people.toLocaleString()), tr('s_claims', S.claims.toLocaleString()),
    tr('s_links', S.edges.toLocaleString()), tr('s_works', S.works), tr('s_gens', S.generations)].join(' · ');
}

/* ---------- routing: the hash is the person; no hash is the front page ---------- */
let cur = null;
function render(){
  const pid = location.hash.slice(1);
  const home = !(pid && D.people[pid]);
  document.body.classList.toggle('home', home);
  $('#home').hidden = !home; $('#person').hidden = home;
  // one search on the page: it sits in the hero on the front page and in the mast elsewhere
  (home ? $('#hs') : $('.mast')).insertBefore($('#searchwrap'), home ? null : $('#langs'));
  if (home) { homeHTML(); cur = null; document.title = 'Wasl — ' + tr('hero').split(' — ')[0]; return; }
  if (pid !== cur) unfolded = false;
  cur = pid;
  $('#crown').innerHTML = crownHTML(pid);
  $('#thread').innerHTML = threadHTML(pid);
  $('#life').innerHTML = lifeHTML(pid);
  document.title = `${lat(pid)} — Wasl`;
}
addEventListener('hashchange', () => { render(); if (cur) scrollTo({top: 0}); });

document.addEventListener('click', e => {
  const u = e.target.closest('[data-unfold]'); if (u) { unfolded = true; $('#thread').innerHTML = threadHTML(cur); return; }
  const fb = e.target.closest('[data-fold]'); if (fb) { unfolded = false; $('#thread').innerHTML = threadHTML(cur); return; }
  const m = e.target.closest('[data-more]'); if (m) { m.nextElementSibling.hidden = false; m.remove(); return; }
  const ed = e.target.closest('[data-edge]');
  if (ed) {
    const li = ed.closest('li'), open = li.querySelector('.edgeq');
    ed.classList.toggle('on', !open);
    if (open) open.remove();
    else { const box = document.createElement('div'); box.className = 'edgeq';
           box.innerHTML = (EDGE[ed.dataset.edge] || []).map(claimHTML).join(''); li.appendChild(box); }
    return;
  }
  const t = e.target.closest('[data-try]'); if (t) { $('#q').value = t.dataset.try; $('#q').dispatchEvent(new Event('input')); $('#q').focus(); }
});

/* ---------- search ---------- */
const fold = s => s.normalize('NFD').replace(/[\u0300-\u036f\u0610-\u061a\u064b-\u065f\u0670\u0640]/g,'')
  .replace(/[\u0623\u0625\u0622\u0671]/g,'\u0627').replace(/\u0629/g,'\u0647')
  .replace(/\u0649/g,'\u064a').replace(/\u0626/g,'\u064a').replace(/\u0624/g,'\u0648')
  .replace(/[\u02bf\u02be'\u2018\u2019]/g,'')
  .replace(/\u0627\u0628[\u0627\u064a](?=\s)/g,'\u0627\u0628\u0648')
  .toLowerCase().trim();
const IDX = Object.entries(D.people).map(([id, p]) => [id, fold([
  p.name_lat, p.name_ar, p.kunya_lat, p.kunya_ar, p.laqab_lat, p.note, NOTABLE.has(id) ? NOTABLE.get(id)[0] : '',
  ...(BY[id] || []).filter(c => (c.type === 'kunya' || c.type === 'alias') && c.subject === id && c.value_ar)
                    .map(c => c.value_lat + ' ' + c.value_ar)].filter(Boolean).join(' '))]);
const lineage = (pid, n = 4) => { const out = []; let c = D.father[pid] || D.mother[pid];
  while (c && out.length < n) { out.push(lat(c)); c = D.father[c] || D.mother[c]; } return out.join(' ‹ '); };
const RES = $('#results');
let hits = [], cursor = -1;
function renderResults(){
  if (!hits.length) { RES.innerHTML = `<div class="none">${esc(tr('noname'))}</div>`; RES.hidden = false; return; }
  RES.innerHTML = hits.slice(0, 40).map((pid, i) => {
    const nb = NOTABLE.get(pid);
    return `<a class="rr${i===cursor?' on':''}" href="#${pid}" data-id="${pid}">
      <span class="ar" dir="rtl" lang="ar">${esc(ara(pid))}</span><span class="lat">${esc(lat(pid))}</span>
      <span class="path">${nb ? `<b>${esc(dtr(nb[1]))}</b> · ` : ''}${esc(lineage(pid)) || '—'}</span></a>`;
  }).join('') + (hits.length > 40 ? `<div class="more">${esc(tr('more_narrow', hits.length - 40))}</div>` : '');
  RES.hidden = false;
}
$('#qclear').onclick = () => { $('#q').value = ''; $('#q').dispatchEvent(new Event('input')); $('#q').focus(); };
$('#q').addEventListener('input', e => {
  $('#qclear').classList.toggle('on', !!e.target.value);
  const q = fold(e.target.value);
  if (!q) { hits = []; cursor = -1; RES.hidden = true; return; }
  hits = IDX.filter(([, t]) => t.includes(q)).map(([id]) => id);
  // the famous first: the directory, an exact name, a companion, then the shortest line
  const rank = p => (NOTABLE.has(p) ? 0 : 20) + (fold(lat(p)) === q ? 0 : 8)
                  + (D.people[p].sahabi ? 0 : 3) + (D.band[p] === 'descendant' ? 3 : 0);
  hits.sort((a, b) => rank(a) - rank(b) || (D.below[b]||0) - (D.below[a]||0));
  cursor = -1; renderResults();
});
$('#q').addEventListener('keydown', e => {
  if (!hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); cursor = Math.max(0, Math.min(hits.length - 1, cursor + (e.key === 'ArrowDown' ? 1 : -1)));
    renderResults(); RES.querySelector('.rr.on')?.scrollIntoView({block: 'nearest'});
  } else if (e.key === 'Enter') { e.preventDefault(); location.hash = hits[Math.max(0, cursor)]; RES.hidden = true; $('#q').blur(); }
  else if (e.key === 'Escape') RES.hidden = true;
});
RES.addEventListener('click', () => { RES.hidden = true; });
$('#q').addEventListener('focus', () => { if (hits.length) RES.hidden = false; });
document.addEventListener('click', e => { if (!e.target.closest('#searchwrap')) RES.hidden = true; });

/* ---------- language picker and chrome ---------- */
function paintChrome(){
  T = D.ui[LANG];
  document.documentElement.lang = LANG;
  $('#q').placeholder = tr('search_ph', S.people.toLocaleString());
  [...$('#langs').children].forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  $('#foot').innerHTML = `<b>${esc(tr('sources_head'))}</b><br>` + Object.entries(D.works)
    .map(([, w]) => `<b>${esc(w.title_lat)}</b>, ${esc(w.author_lat)} (${esc(tr('died_ah', w.death_ah))}) · ${esc(w.edition)}`).join('<br>')
    + `<br><br>${esc(tr('footer_note'))}<br><a href="tree.html">${esc(tr('open_tree'))}</a> · <a href="https://github.com/hendrasaputra/wasl">GitHub</a>`;
  render();
}
$('#langs').innerHTML = Object.entries(D.langs).map(([k, name]) => `<button type="button" data-l="${k}" title="${esc(name)}">${k.toUpperCase()}</button>`).join('');
$('#langs').addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (!b) return;
  LANG = b.dataset.l; localStorage.setItem('wasl-lang', LANG); paintChrome(); });
paintChrome();
</script>
<script src="tools/check_responsive.js"></script>
</body>
</html>
