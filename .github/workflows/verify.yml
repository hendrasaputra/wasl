name: verify
on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Fetch the pinned source texts
        run: ./fetch.sh
      - name: Confirm the fetched texts are the ones pinned
        run: cd corpus && shasum -a 256 -c SHA256SUMS

      - name: Prove every quote against the corpus
        run: python3 validate.py
      - name: Independent checks
        run: python3 test_wasl.py
      - name: Confirm every pinned entry still resolves
        run: python3 tools/build_entries.py
      - name: Confirm every summary sentence still anchors
        run: python3 tools/build_summaries.py

      - name: Rebuild and confirm the committed page is current
        run: |
          python3 build.py
          git diff --exit-code index.html \
            || (echo "index.html is stale - run python3 build.py and commit"; exit 1)

      # The biography pages carry a quarter of a million words of OpenITI's Arabic. They are
      # built here and deployed from the artifact, never committed, so the repository keeps
      # holding pins and checksums rather than the texts themselves.
      - name: Build the biography pages
        run: python3 tools/build_bios.py

      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' \
                --exclude='corpus' --exclude='_site' --exclude='__pycache__' \
                ./ _site/
          # belt and braces: the corpus is OpenITI's, not ours to redistribute, and a stray
          # copy in the artifact would publish it.
          rm -rf _site/corpus
          test ! -e _site/corpus
          test -f _site/index.html -a -f _site/CNAME -a -f _site/.nojekyll
          echo "staged $(find _site -name '*.html' | wc -l) html files"

      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
